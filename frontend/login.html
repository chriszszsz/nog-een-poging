<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Login — Maturity Platform</title>

<style>

body{
  margin:0;
  font-family:Inter,sans-serif;
  background:#0d1428;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
}

.card{
  width:380px;
  background:#151d35;
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;
  padding:40px;
}

h1{
  margin:0 0 30px;
  font-size:28px;
}

label{
  display:block;
  margin-bottom:8px;
  font-size:14px;
}

input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:none;
  margin-bottom:20px;
  background:#0f172b;
  color:white;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#4d7aff;
  color:white;
  font-weight:600;
  cursor:pointer;
}

button:hover{
  background:#3d69ef;
}

.error{
  margin-top:16px;
  color:#ff6b6b;
  font-size:14px;
}

</style>
</head>

<body>

<div class="card">

  <h1>Inloggen</h1>

  <label>Email</label>
  <input
    type="email"
    id="email"
    placeholder="naam@bedrijf.nl"
  />

  <label>Wachtwoord</label>
  <input
    type="password"
    id="password"
    placeholder="Wachtwoord"
  />

  <button onclick="login()">
    Inloggen
  </button>

  <div
    class="error"
    id="error"
  ></div>

</div>

<script>

const backend =
'https://maturity-assessment-api-avh2h6cuf8acg5fk.westeurope-01.azurewebsites.net';

async function login() {

  try {

    const email =
      document.getElementById("email").value;

    const password =
      document.getElementById("password").value;

    const response =
      await fetch(
        `${backend}/api/login`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            email,
            password
          })
        }
      );

    const data = await response.json();

    if (!response.ok) {

      document.getElementById("error")
        .textContent =
          data.error || "Login mislukt";

      return;

    }

    localStorage.setItem(
      "token",
      data.token
    );

    localStorage.setItem(
      "user",
      JSON.stringify(data.user)
    );

    window.location.href =
      "./index.html";

  } catch (err) {

    console.error(err);

    document.getElementById("error")
      .textContent =
        "Server fout";

  }

}

</script>

</body>
</html>
