async function fetchCampaigns() {

  try {

    const response =
      await fetch(`${defaultConfig.backend_url}/api/campaigns`);

    if (!response.ok) throw new Error('geen campaigns');

    campaigns = await response.json();

  } catch (err) {

    console.warn('fallback campaigns');

    campaigns = [
      {
        title: "AI Assessment 2026",
        company_name: "Axians",
        participant_count: 3,
        status: "IN_PROGRESS"
      }
    ];

  }

  renderCampaigns();
}


function renderCampaigns() {

    tbody.innerHTML = `

  tbody.innerHTML =

    `).join('');

    async function fetchAssessments() {
      const backend = (window.elementSdk?.config?.backend_url || defaultConfig.backend_url).replace(/\/$/, '');
      try {
        const response = await fetch(`${backend}/api/assessments`);
        if (!response.ok) throw new Error('Backend niet bereikbaar');
        const data = await response.json();
        if (!Array.isArray(data) || data.length === 0) throw new Error('Geen assessments beschikbaar');
        assessments = data;
      } catch (error) {
        console.warn('Fallback naar mock data:', error.message);
        assessments = mockAssessments;
      }
      renderOverviewCards();
      renderAssessmentsTable();
      renderCompanyCards();
    }
    function switchTab(tab) {

  currentTab = tab;

  const overviewBtn = document.getElementById('tab-overview');
  const companiesBtn = document.getElementById('tab-companies');
  const campaignsBtn = document.getElementById('tab-campaigns');

  const overviewTab = document.getElementById('overview-tab');
  const companiesTab = document.getElementById('companies-tab');
  const campaignsTab = document.getElementById('campaigns-tab');

  // TOGGLE CONTENT
  overviewTab?.classList.toggle('hidden', tab !== 'overview');
  companiesTab?.classList.toggle('hidden', tab !== 'companies');
  campaignsTab?.classList.toggle('hidden', tab !== 'campaigns');

  // RESET ALLE TABS
  [overviewBtn, companiesBtn, campaignsBtn].forEach(btn => {
    btn.classList.remove('border-blue-600', 'text-blue-600');
    btn.classList.add('border-transparent', 'text-slate-600');
  });

  // ACTIVE TAB
  const activeBtn = document.getElementById(`tab-${tab}`);
  if (activeBtn) {
    activeBtn.classList.add('border-blue-600', 'text-blue-600');
    activeBtn.classList.remove('border-transparent', 'text-slate-600');
  }

  // RENDER
  if (tab === 'overview') {
    renderOverviewCards();
    renderAssessmentsTable();
  }

  if (tab === 'companies') {
    renderCompanyCards();
  }

  if (tab === 'campaigns') {
    renderCampaigns();
  }
}

    }

    function filterOverviewSearch() {
      overviewSearchTerm = document.getElementById('overview-search').value.trim().toLowerCase();
      renderAssessmentsTable();
    }

    function filterCompanySearch() {
      companySearchTerm = document.getElementById('company-search').value.trim().toLowerCase();
      renderCompanyCards();
    }

    function setOverviewSort(column) {
      if (overviewSortColumn === column) {
        overviewSortDirection = overviewSortDirection === 'asc' ? 'desc' : 'asc';
      } else {
        overviewSortColumn = column;
        overviewSortDirection = 'asc';
      }
      renderAssessmentsTable();
    }

    function sortAssessments(items) {
      return [...items].sort((a, b) => {
        const direction = overviewSortDirection === 'asc' ? 1 : -1;
        if (overviewSortColumn === 'company_name') {
          return a.company_name.localeCompare(b.company_name) * direction;
        }
        if (overviewSortColumn === 'average_score') {
          return (Number(a.average_score) - Number(b.average_score)) * direction;
        }
        if (overviewSortColumn === 'assessment_date') {
          return (new Date(a.assessment_date) - new Date(b.assessment_date)) * direction;
        }
        if (overviewSortColumn === 'status') {
          return ((statusOrder[a.status] || 0) - (statusOrder[b.status] || 0)) * direction;
        }
        return 0;
      });
    }

    function formatDutchDate(dateString) {
      return dateString ? new Date(dateString).toLocaleDateString('nl-NL') : '-';
    }

    function renderOverviewCards() {

  const el1 = document.getElementById('stat-assessments');
  if (!el1) return; // ✅ STOP als niet aanwezig

  const total = assessments.length;

  const average =
    total === 0
      ? 0
      : (
          assessments.reduce((sum, item) => sum + Number(item.average_score), 0) / total
        ).toFixed(1);

  const completed =
    assessments.filter(item => statusMapNL[item.status] === 'Afgerond').length;

  const lastUpdate =
    assessments.reduce(
      (latest, item) =>
        item.assessment_date > latest ? item.assessment_date : latest,
      ''
    );

  document.getElementById('stat-assessments').textContent = total;
  document.getElementById('stat-average').textContent = average;
  document.getElementById('stat-completed').textContent = completed;
  document.getElementById('stat-last-update').textContent =
    lastUpdate ? new Date(lastUpdate).toLocaleDateString('nl-NL') : '-';
}

    function renderCompanyCards() {
      const container = document.getElementById('company-cards');
      if (!container) return;
      const filtered = assessments.filter(item => item.company_name.toLowerCase().includes(companySearchTerm));
      const companies = Object.values(filtered.reduce((acc, item) => {
        if (!acc[item.company_name]) {
          acc[item.company_name] = {
            company_name: item.company_name,
            latestAssessment: item,
            assessments: [item]
          };
        } else {
          acc[item.company_name].assessments.push(item);
          if (new Date(item.assessment_date) > new Date(acc[item.company_name].latestAssessment.assessment_date)) {
            acc[item.company_name].latestAssessment = item;
          }
        }
        return acc;
      }, {}));
      if (companies.length === 0) {
        container.innerHTML = '<div class="col-span-full rounded-2xl bg-white p-8 text-center text-slate-500">Geen bedrijven gevonden.</div>';
        return;
      }
      container.innerHTML = companies.sort((a, b) => a.company_name.localeCompare(b.company_name)).map(company => {
        const address = companyAddresses[company.company_name] || 'Adres niet beschikbaar';
        return `
          <div class="rounded-3xl bg-white p-6 shadow-sm ring-1 ring-slate-200 hover:shadow-md transition">
            <div class="flex flex-col gap-2">
              <h3 class="text-lg font-semibold text-slate-900">${company.company_name}</h3>

            </div>
          </div>
        `;
      }).join('');
    }

    async function viewAssessment(id) {
      const backend = (window.elementSdk?.config?.backend_url || defaultConfig.backend_url).replace(/\/$/, '');
      try {
        const response = await fetch(`${backend}/api/assessments/${id}`);
        if (!response.ok) throw new Error('Assessment niet gevonden');
        selectedAssessment = await response.json();
      } catch (error) {
        selectedAssessment = assessments.find(item => item.id === id) || null;
      }
      selectedCompany = null;
      if (!selectedAssessment) return;
      renderAssessmentDetail();
      document.getElementById('dashboard-view').classList.add('hidden');
      document.getElementById('assessment-detail-screen').classList.remove('hidden');
    }

    function viewCompany(companyName) {

      selectedAssessment = null;
      renderCompanyDetail();
      document.getElementById('dashboard-view').classList.add('hidden');
      document.getElementById('assessment-detail-screen').classList.remove('hidden');
    }

    function renderSpiderChart(scores) {
      const chart = document.getElementById('spider-chart');
      if (!chart) return;
      const labels = Object.keys(scores);
      const values = Object.values(scores);
      const size = 520;
      const center = size / 2;
      const radius = 170;
      const maxLabelChars = 28;
      const lineSpacing = 10;
      const points = values.map((value, index) => {
        const angle = Math.PI / 2 + (index * 2 * Math.PI) / labels.length;
        const distance = (value / 5) * radius;
        return [center + Math.cos(angle) * distance, center - Math.sin(angle) * distance];
      });
      const wrapLabel = (text, maxChars = maxLabelChars) => {
        const words = text.split(' ');
        const lines = [];
        let current = '';
        words.forEach((word) => {
          const next = current ? `${current} ${word}` : word;
          if (next.length <= maxChars || !current) {
            current = next;
          } else {
            lines.push(current);
            current = word;
          }
        });
        if (current) lines.push(current);
        return lines;
      };
      chart.innerHTML = `
        <svg viewBox="0 0 ${size} ${size}" overflow="visible" class="mx-auto block">
          ${[1, 0.75, 0.5, 0.25].map(factor => {
            const level = labels.map((_, index) => {
              const angle = Math.PI / 2 + (index * 2 * Math.PI) / labels.length;
              return [center + Math.cos(angle) * radius * factor, center - Math.sin(angle) * radius * factor].join(',');
            }).join(' ');
            return `<polygon points="${level}" fill="none" stroke="#cbd5e1" stroke-width="1" />`;
          }).join('')}
          ${labels.map((_, index) => {
            const angle = Math.PI / 2 + (index * 2 * Math.PI) / labels.length;
            const x = center + Math.cos(angle) * radius;
            const y = center - Math.sin(angle) * radius;
            return `<line x1="${center}" y1="${center}" x2="${x}" y2="${y}" stroke="#cbd5e1" stroke-width="1" />`;
          }).join('')}
          <polygon points="${points.map(p => p.join(',')).join(' ')}" fill="rgba(59,130,246,0.2)" stroke="#2563eb" stroke-width="2" />
          ${points.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#2563eb" />`).join('')}
          ${labels.map((label, index) => {
            const angle = Math.PI / 2 + (index * 2 * Math.PI) / labels.length;
            const x = center + Math.cos(angle) * (radius + 42);
            const y = center - Math.sin(angle) * (radius + 42);
            const anchor = Math.abs(Math.cos(angle)) < 0.1 ? 'middle' : (Math.cos(angle) > 0 ? 'start' : 'end');
            const lines = wrapLabel(label);
            return `<text x="${x}" y="${y}" text-anchor="${anchor}" dominant-baseline="middle" font-size="9" fill="#334155">${lines.map((line, lineIndex) => `<tspan x="${x}" dy="${lineIndex === 0 ? 0 : lineSpacing}">${line}</tspan>`).join('')}</text>`;
          }).join('')}
        </svg>
      `;
    }

async function createCampaign() {

  try {

    const title =
      document.getElementById(
        "campaign-title"
      ).value;

    const company_id =
      Number(
        document.getElementById(
          "campaign-company"
        ).value
      );

    const participant_ids =
      Array.from(
        document.querySelectorAll(
          ".participant-checkbox:checked"
        )
      ).map(el => Number(el.value));

    const response =
      await fetch(
        `${defaultConfig.backend_url}/api/campaigns`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            title,
            company_id,
            participant_ids
          })
        }
      );

    const data =
      await response.json();

    console.log(data);

    if (!response.ok) {

      alert(
        data.error ||
        "Campaign aanmaken mislukt."
      );

      return;

    }

    alert(
      "Campaign aangemaakt ✅"
    );

    closeCampaignModal();

    window.location.reload();

  } catch (err) {

    console.error(err);

    alert(
      "Serverfout bij aanmaken van campaign."
    );

  }

}
